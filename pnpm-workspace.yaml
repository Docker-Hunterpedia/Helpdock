packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11+ reads every setting except registry and authentication from this file
# rather than from .npmrc.
saveExact: true
autoInstallPeers: true
allowBuilds:
  # argon2 is a native binding. Its install script unpacks the prebuilt binary
  # for this platform, or compiles one; without it `require('argon2')` throws
  # and no password can be hashed or verified.
  argon2: true
  # Transitive dependencies of `@testcontainers/*` (via dockerode). None of
  # their install scripts are needed: cpu-features and ssh2 only build an
  # optional native speed-up for SSH, which Testcontainers does not use against
  # a local Docker socket, and protobufjs only regenerates bundled code.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # drizzle-kit runs esbuild, whose install script unpacks the platform binary
  # the CLI needs. Without it `drizzle-kit generate` cannot run.
  esbuild: true
  # A transitive dependency of `bullmq` (through msgpackr). Its install script
  # builds an optional native accelerator; without it msgpackr uses its
  # JavaScript implementation, which is what BullMQ is published against.
  msgpackr-extract: false
  # A transitive dependency of `@mariozechner/pi-ai`. Its only install script
  # is a no-op `preinstall` echo; the published package is already built.
  '@google/genai': false
# Transitive dependencies with advisories (`pnpm audit --audit-level high` in
# `ci.yml`) whose direct dependants have not yet released a bump. Each entry is
# removed once the dependant pins a patched version; the reason is in
# docs/guides/security-scanning.md.
overrides:
  # moderate, direct and via @nestjs/platform-fastify; patched before 1.0
  'fastify@<5.12.6': '>=5.12.6'
  # critical, via @changesets/cli > launch-editor
  'shell-quote@<1.11.0': '>=1.11.0'
  # high, via @mariozechner/pi-ai > proxy-agent > pac-proxy-agent > get-uri
  'basic-ftp@<=6.2.0': '>=6.2.1'
  # high, via vitest > vite > postcss
  'source-map-js@<1.2.2': '>=1.2.2'
  # high, via @changesets/cli > launch-editor (GHSA-587h-7wmj-h5pm, GHSA-698v-4r3x-3vcv, GHSA-r825-w8mm-5pxw)
  'launch-editor@<2.14.2': '>=2.14.2'
  # high, vitest > vite and @vitejs/plugin-react > vite (GHSA-587h-7wmj-h5pm); direct pins are 8.3.4
  'vite@>=8.3.0 <8.3.3': '>=8.3.3'
  # high, via testcontainers and, on the 7.x line, @mariozechner/pi-ai and cheerio (GHSA-xjj6-f33q-929c)
  'undici@>=7.18.0 <7.30.1': '7.30.1'
  'undici@>=8.0.0 <8.12.2': '8.12.2'
  # high, the optional vitest peer resolved for the root and test tooling (GHSA-834v-8h66-3h79); the apps pin 21.0.4
  'happy-dom@>=17.0.0 <21.0.4': '21.0.4'
