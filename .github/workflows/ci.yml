name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Named `ci` so it can be added as the required status check on the `main`
  # ruleset. Integration tests (Testcontainers), CodeQL and the image build join
  # this workflow with M0-11.
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Check app import boundaries
        run: pnpm check:boundaries

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test

      # GitHub-hosted runners ship a Docker daemon, so Testcontainers starts the
      # containers itself. No service container is declared here on purpose.
      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      # Keyed by the Playwright version the lockfile resolved, so an upgrade
      # downloads the matching browser instead of reusing the old one.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @helpdock/admin exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm --filter @helpdock/admin exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm --filter @helpdock/admin e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin/playwright-report
          retention-days: 7
