name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The complete regression run, including the suites a pull request skips.
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only. Nothing in this workflow publishes: the image is built and loaded
# into the local daemon for the smoke test, and `release.yml` is the only
# workflow that pushes anything anywhere.
permissions:
  contents: read
  pull-requests: read

# Every job below repeats the same short setup (checkout, pnpm, Node, install)
# rather than sharing a workspace: jobs run on separate runners, and an install
# from the pnpm cache is quicker than uploading and downloading `node_modules`.
#
# Notes that apply to each copy:
# - `persist-credentials: false` because nothing here pushes. By default
#   `checkout` leaves the run's token in `.git/config`, where every install
#   script, build plugin and test could read it — and on a pull request those
#   steps are running the contributor's code.
# - The Docker Hub login is optional on purpose. Anonymous pulls are rate
#   limited per IP and a GitHub-hosted runner shares its address with everybody
#   else's; authenticating lifts the limit. A fork has no such secret, and the
#   run must still work without one — which is why MinIO comes from Chainguard's
#   public registry instead (`docker-compose.yml`, `media.integration.test.ts`).
#   `secrets` is not a context `if:` can read, but `jobs.<id>.env` can, so
#   `DOCKERHUB_CONFIGURED` turns "is an account configured?" into an ordinary
#   value without ever putting the token in an expression. Without an
#   account, every Docker Hub image comes through `mirror.gcr.io`, Google's
#   pull-through cache of Docker Hub, which has no such limit: Testcontainers
#   through `TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX`, the Dockerfile through its
#   `NODE_IMAGE` argument, and the smoke stack's Postgres and Redis
#   pulled ahead and tagged under the names the Compose file uses.
# - ffmpeg: the media pipeline spawns ffmpeg and ffprobe (ARCHITECTURE §9) and
#   the suites that exercise them skip themselves when they are absent, so the
#   jobs that run those suites install it.

jobs:
  # Keep the required context present; select jobs rather than filtering the workflow.
  # PRs include affected workspace consumers; main runs the checks; nightly runs everything.
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.classify.outputs.run_full }}
      run_api: ${{ steps.classify.outputs.run_api }}
      run_import_reference: ${{ steps.classify.outputs.run_import_reference }}
      run_admin: ${{ steps.classify.outputs.run_admin }}
      run_widget: ${{ steps.classify.outputs.run_widget }}
      run_unit: ${{ steps.classify.outputs.run_unit }}
      run_integration: ${{ steps.classify.outputs.run_integration }}
      run_browser_api: ${{ steps.classify.outputs.run_browser_api }}
      run_image: ${{ steps.classify.outputs.run_image }}
      run_semgrep: ${{ steps.classify.outputs.run_semgrep }}
      typecheck_filters: ${{ steps.classify.outputs.typecheck_filters }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Classify the changed paths
        id: classify
        env:
          CHANGED_FILE_COUNT: ${{ github.event.pull_request.changed_files }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          suites='run_api run_import_reference run_admin run_widget run_unit run_integration run_browser_api run_image run_semgrep'
          if [ "$EVENT_NAME" = 'push' ]; then
            # The ruleset requires a branch to be up to date and green before it
            # merges, so main already passed these suites as a pull request.
            # Keep the cheap repository-wide checks; the nightly run covers the rest.
            echo 'run_full=true' >> "$GITHUB_OUTPUT"
            for suite in $suites; do echo "$suite=false" >> "$GITHUB_OUTPUT"; done
            echo 'typecheck_filters=[]' >> "$GITHUB_OUTPUT"
            echo 'A push to main runs the repository-wide checks only.'
            exit 0
          fi
          if [ "$EVENT_NAME" != 'pull_request' ]; then
            echo 'run_full=true' >> "$GITHUB_OUTPUT"
            for suite in $suites; do echo "$suite=true" >> "$GITHUB_OUTPUT"; done
            echo 'typecheck_filters=[]' >> "$GITHUB_OUTPUT"
            echo 'A scheduled or manual run executes the complete suite.'
            exit 0
          fi

          changed_files_json=$(mktemp)
          trap 'rm -f "$changed_files_json"' EXIT
          gh api --paginate --slurp \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/files" \
            > "$changed_files_json"

          node scripts/ci-scope.ts "$changed_files_json" "$CHANGED_FILE_COUNT"

  # Cheap, local and first to fail: lint, the three source checks and the
  # typecheck.
  checks:
    name: checks
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Check app import boundaries
        run: pnpm check:boundaries

      # UX-04: a bare toLocale* call follows the browser's locale instead of the
      # app's, which turns dates into Arabic-Indic digits in `ar` (DESIGN §7).
      - name: Check locale arguments
        run: pnpm check:locale-args

      # DOMAIN-RULES §1.3: "Missing decorator fails the request in development
      # and in CI." The permission guard is the runtime half; this is CI's.
      - name: Check route permission declarations
        if: needs.scope.outputs.run_api == 'true'
        run: pnpm check:routes

      # The same idea for input: every @Param, @Query and @Body names its
      # schema, so validation cannot be switched off by an `import type`
      # (issue #36).
      - name: Check route input validation
        if: needs.scope.outputs.run_api == 'true'
        run: pnpm check:validation

      - name: Typecheck all workspaces and repository tooling
        if: needs.scope.outputs.run_full == 'true'
        run: pnpm typecheck

      - name: Typecheck affected workspaces
        if: needs.scope.outputs.run_full != 'true'
        env:
          TYPECHECK_FILTERS: ${{ needs.scope.outputs.typecheck_filters }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const filters = JSON.parse(process.env.TYPECHECK_FILTERS);
          if (filters.length) execFileSync('pnpm', ['exec', 'turbo', 'run', 'typecheck', ...filters.map(name => `--filter=${name}`)], { stdio: 'inherit' });
          JS

      # The second half of `pnpm typecheck`, which main runs in full: the root
      # project covers every test file and the `src/testing` helpers, which no
      # workspace typecheck includes. It needs every package built, since tests
      # import across them.
      - name: Typecheck tests and test helpers
        if: needs.scope.outputs.run_full != 'true' && needs.scope.outputs.typecheck_filters != '[]'
        run: |
          pnpm exec turbo run build --filter='./packages/*'
          pnpm exec tsc --noEmit

      # ARCHITECTURE §15: "CI runs `pnpm audit`". High and critical advisories
      # fail the run; Renovate's vulnerability alerts open the fix for anything
      # lower without waiting for its weekly window.
      - name: Dependency audit
        run: pnpm audit --audit-level high

  # ARCHITECTURE §15's "Semgrep rules for Nest" (M9-05): the engineering rules of
  # AGENTS.md that a type checker cannot see, in `.semgrep/helpdock.yml`. The
  # fixtures run first, so a rule that stopped matching fails here rather than
  # passing everything. Pinned like every other tool; Renovate moves it.
  semgrep:
    name: semgrep
    needs: scope
    if: needs.scope.outputs.run_semgrep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Semgrep
        run: pipx install semgrep==1.179.0
      - name: Rule fixtures
        run: semgrep scan --test --metrics=off .semgrep
      - name: Scan
        run: semgrep scan --config .semgrep/helpdock.yml --error --metrics=off apps packages scripts

  # The `packages/*` gate of ARCHITECTURE §15 (80 % of lines, root
  # `vitest.config.ts`). The api and admin unit suites are left out here
  # because their own gates below run them; the packages' number does not
  # depend on them.
  unit:
    name: unit
    needs: scope
    if: needs.scope.outputs.run_unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages resolve to `dist/` through their `exports` maps, and
      # the suites import them. Turbo's `test` task depends on `^build` for the
      # same reason.
      - name: Build workspace packages
        run: pnpm exec turbo run build --filter='./packages/*'


      # Deployment contracts run the real merge; missing Compose must fail this job.
      - name: Verify Docker Compose is available
        run: docker compose version

      - name: Packages unit tests with coverage
        run: pnpm exec vitest run --coverage --project='!integration' --project='!@helpdock/api' --project='!@helpdock/admin'

  # The admin's own gate from M0-08: the first-run wizard is the one screen an
  # operator cannot skip, and the packages gate measures `packages/*` only.
  # Coverage is sharded across runners, then merged below before the unchanged
  # 85 % threshold is evaluated. The blob is the test result and its coverage
  # payload; no source or dependency artifact crosses the runner boundary. A
  # partial shard cannot meet a full-suite threshold, so its CLI threshold is
  # zero; the merge job loads the config's real threshold and is required.
  admin-unit:
    name: admin-unit shard (${{ matrix.shard }}/2)
    needs: scope
    if: needs.scope.outputs.run_admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages resolve to `dist/` through their `exports` maps, and
      # the suites import them. Turbo's `test` task depends on `^build` for the
      # same reason.
      - name: Build workspace packages
        run: pnpm exec turbo run build --filter='./packages/*'


      - name: Admin unit tests with coverage
        run: >-
          pnpm --filter @helpdock/admin exec vitest run
          --config vitest.config.ts
          --coverage
          --coverage.thresholds.lines=0
          --maxWorkers=2
          --reporter=default
          --reporter=blob
          --shard=${{ matrix.shard }}/2
          --outputFile.blob=.vitest/blob/report-${{ matrix.shard }}.json

      - name: Upload the coverage shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-coverage-${{ matrix.shard }}
          path: apps/admin/.vitest/blob/report-${{ matrix.shard }}.json
          retention-days: 1

  admin-coverage:
    name: admin-unit
    needs: [scope, admin-unit]
    if: needs.scope.outputs.run_admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the coverage shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: admin-coverage-*
          path: apps/admin/.vitest/blob
          merge-multiple: true
      - name: Merge coverage and enforce the threshold
        run: >-
          pnpm --filter @helpdock/admin exec vitest
          --config vitest.config.ts
          --merge-reports=.vitest/blob
          --coverage

  # The api is the one workspace whose behaviour is mostly reached over HTTP,
  # so its gate is measured across its unit and integration suites together
  # (M0-05). This is the only run of either: GitHub-hosted runners ship a
  # Docker daemon, and Testcontainers starts Postgres, Redis and MinIO itself.
  # As above, shards only collect; the merge job enforces the real 90 % gate.
  api:
    name: api shard (${{ matrix.shard }}/2)
    needs: scope
    if: needs.scope.outputs.run_api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      # No account: pull through Google's mirror (see the top of this file).
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ${{ (secrets.DOCKERHUB_USERNAME == '' || secrets.DOCKERHUB_TOKEN == '') && 'mirror.gcr.io/' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_CONFIGURED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install ffmpeg
        # The runner image ships Microsoft's package repository, which sometimes
        # answers 403 and fails the whole update. ffmpeg comes from Ubuntu's own
        # archive, so that list is dropped before updating.
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update && sudo apt-get install --no-install-recommends --yes ffmpeg
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages resolve to `dist/` through their `exports` maps, and
      # the suites import them. Turbo's `test` task depends on `^build` for the
      # same reason.
      - name: Build workspace packages
        run: pnpm exec turbo run build --filter='./packages/*'


      - name: Api unit and integration tests with coverage
        run: >-
          pnpm --filter @helpdock/api exec vitest run
          --config vitest.coverage.config.ts
          --coverage
          --coverage.thresholds.lines=0
          --maxWorkers=2
          --reporter=default
          --reporter=blob
          --shard=${{ matrix.shard }}/2
          --outputFile.blob=.vitest/blob/report-${{ matrix.shard }}.json

      - name: Upload the coverage shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-coverage-${{ matrix.shard }}
          path: apps/api/.vitest/blob/report-${{ matrix.shard }}.json
          retention-days: 1

  import-reference:
    name: import-reference (${{ matrix.source }})
    needs: scope
    if: needs.scope.outputs.run_import_reference == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        source: [Zendesk, freshdesk, zohodesk]
    env:
      DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      # No account: pull through Google's mirror (see the top of this file).
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ${{ (secrets.DOCKERHUB_USERNAME == '' || secrets.DOCKERHUB_TOKEN == '') && 'mirror.gcr.io/' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_CONFIGURED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages resolve to `dist/` through their `exports` maps, and
      # the suites import them. Turbo's `test` task depends on `^build` for the
      # same reason.
      - name: Build workspace packages
        run: pnpm exec turbo run build --filter='./packages/*'


      - name: Reference import with real Postgres and Redis
        run: >-
          pnpm exec vitest run --project integration
          apps/api/src/imports/zendesk-reference.integration.test.ts
          apps/api/src/imports/native-reference.integration.test.ts
          --testNamePattern '${{ matrix.source }}'
          --maxWorkers=1

  api-coverage:
    name: api
    needs: [scope, api]
    if: needs.scope.outputs.run_api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the coverage shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: api-coverage-*
          path: apps/api/.vitest/blob
          merge-multiple: true
      - name: Merge coverage and enforce the threshold
        run: >-
          pnpm --filter @helpdock/api exec vitest
          --config vitest.coverage.config.ts
          --merge-reports=.vitest/blob
          --coverage

  # The integration suites under `packages/*`; the api's run in the job above.
  integration:
    name: integration
    needs: scope
    if: needs.scope.outputs.run_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      # No account: pull through Google's mirror (see the top of this file).
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ${{ (secrets.DOCKERHUB_USERNAME == '' || secrets.DOCKERHUB_TOKEN == '') && 'mirror.gcr.io/' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_CONFIGURED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install ffmpeg
        # The runner image ships Microsoft's package repository, which sometimes
        # answers 403 and fails the whole update. ffmpeg comes from Ubuntu's own
        # archive, so that list is dropped before updating.
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update && sudo apt-get install --no-install-recommends --yes ffmpeg
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages resolve to `dist/` through their `exports` maps, and
      # the suites import them. Turbo's `test` task depends on `^build` for the
      # same reason.
      - name: Build workspace packages
        run: pnpm exec turbo run build --filter='./packages/*'


      - name: Packages integration tests
        run: pnpm exec vitest run --project=integration packages/

  # The admin in a browser against mocked adapters, split across runners. The
  # screenshot comparison and the real-api run are in `browser-api` below.
  e2e:
    name: e2e (${{ matrix.shard }}/4)
    needs: scope
    if: needs.scope.outputs.run_admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages resolve to `dist/` through their `exports` maps; the
      # mocked run serves the admin from Vite and needs no app build.
      - name: Build workspace packages
        run: pnpm exec turbo run build --filter='./packages/*'

      # Keyed by the Playwright version the lockfile resolved, so an upgrade
      # downloads the matching browser instead of reusing the old one.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @helpdock/admin exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        run: pnpm --filter @helpdock/admin exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm --filter @helpdock/admin e2e --shard=${{ matrix.shard }}/4

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/admin/playwright-report
          retention-days: 7

  # The widget on its harness page with the mock transport.
  widget-e2e:
    name: widget-e2e
    needs: scope
    if: needs.scope.outputs.run_widget == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm exec turbo run build --filter='./packages/*'

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @helpdock/widget exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        run: pnpm --filter @helpdock/widget exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm --filter @helpdock/widget e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-widget
          path: apps/widget/playwright-report
          retention-days: 7

  # Pixels, and the same screens against a real api, Postgres and Redis (the M0
  # exit criterion that every auth method works end to end).
  browser-api:
    name: browser-api
    needs: scope
    if: needs.scope.outputs.run_browser_api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      # No account: pull through Google's mirror (see the top of this file).
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ${{ (secrets.DOCKERHUB_USERNAME == '' || secrets.DOCKERHUB_TOKEN == '') && 'mirror.gcr.io/' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_CONFIGURED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `e2e:api` starts `apps/api/dist/main.js` and serves `apps/admin/dist`.
      - name: Build
        run: pnpm build

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @helpdock/admin exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        run: pnpm --filter @helpdock/admin exec playwright install --with-deps chromium

      # A comparison with no baseline on disk fails rather than skips, so the
      # step asks first. The baselines are Linux and are produced by
      # `screenshots.yml` on this same runner image with this same browser
      # install, which is what makes them comparable at all.
      - name: Are the screenshot baselines committed?
        id: baselines
        run: |
          if [ -d apps/admin/e2e/__screenshots__ ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Screenshot comparison
        if: steps.baselines.outputs.present == 'true'
        run: pnpm --filter @helpdock/admin e2e:screenshots

      - name: Sign-in rate-limit browser tests (en and ar, stubbed HTTP)
        run: pnpm --filter @helpdock/admin exec playwright test --config playwright.auth-refusals.config.ts

      - name: Browser tests against the real api
        run: pnpm --filter @helpdock/admin e2e:api

      - name: Import browser tests against the real api (en and ar)
        run: pnpm --filter @helpdock/admin e2e:imports --workers=1

      # The pages the api renders itself: the hosted web form and the help
      # center, in `en` and `ar`. They previously extended the slowest mocked
      # admin shard; this job already has the build and browser they need.
      - name: Api page browser tests
        if: needs.scope.outputs.run_api == 'true'
        run: pnpm --filter @helpdock/api e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-api
          path: apps/admin/playwright-report
          retention-days: 7

  # The image this commit produces, and the browser-less M0-09 smoke test on
  # it. Needs no Node: Docker builds everything from the Dockerfile.
  image:
    name: image
    needs: scope
    if: needs.scope.outputs.run_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_CONFIGURED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Not pushed: the release workflow publishes the multi-arch image
      # (ARCHITECTURE §16). `load: true` puts it in the daemon so the smoke test
      # below runs the image this commit produced.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/docker-hunterpedia/helpdock:ci
          build-args: |
            HELPDOCK_VERSION=ci
            HELPDOCK_GIT_SHA=${{ github.sha }}
            NODE_IMAGE=${{ (secrets.DOCKERHUB_USERNAME == '' || secrets.DOCKERHUB_TOKEN == '') && 'mirror.gcr.io/library/node:24-bookworm-slim' || 'node:24-bookworm-slim' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No account: the stack's Postgres and Redis come through the mirror
      # and are tagged under the names the Compose file uses, so `compose up`
      # finds them in the daemon and pulls nothing from Docker Hub.
      - name: Pull the stack's images through the mirror
        if: env.DOCKERHUB_CONFIGURED != 'true'
        run: |
          for image in pgvector/pgvector:pg17 redis:7-alpine; do
            case "$image" in
              */*) source="mirror.gcr.io/$image" ;;
              *) source="mirror.gcr.io/library/$image" ;;
            esac
            docker pull --quiet "$source"
            docker tag "$source" "$image"
          done

      # The stack comes up, the api serves the admin build, an unverified domain
      # gets no certificate, and an image goes through the media pipeline.
      - name: Compose smoke test
        run: ./scripts/compose-smoke.sh
        env:
          HELPDOCK_VERSION: ci

  # The one required status check on the `main` ruleset, under the name it has
  # always had. It passes only when every job above passed, so the ruleset does
  # not have to list them, and adding a job here never needs a settings change.
  ci:
    name: ci
    if: always()
    needs:
      [
        checks,
        scope,
        semgrep,
        unit,
        admin-unit,
        admin-coverage,
        api,
        api-coverage,
        import-reference,
        integration,
        e2e,
        widget-e2e,
        browser-api,
        image,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
