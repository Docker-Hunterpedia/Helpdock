name: Changesets

# ARCHITECTURE §16: "Main: Changesets version PR → on merge: tag, GitHub release
# with changelog + SBOM …". This is the first half. It keeps a pull request open
# on `main` that consumes every `.changeset/*.md` accumulated since the last
# release, bumps `apps/api/package.json` — the version the System page reports
# and the image is tagged with — and writes its changelog.
#
# It publishes nothing to npm: every workspace is private. The second half runs
# when that pull request merges and no changesets are left: `tag` pushes
# `v<version>` once, and `release` calls `release.yml`, which turns it into an
# image and a GitHub Release. A maintainer can still push a `v*` tag by hand.
on:
  push:
    branches: [main]

concurrency:
  group: changesets-${{ github.ref }}
  # A push during the image build must not cancel a release whose tag exists.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.changesets.outputs.hasChangesets }}
    permissions:
      # The `changeset-release/main` branch the action force-pushes.
      contents: write
      # The "Version Packages" pull request itself. The repository setting
      # "Allow GitHub Actions to create and approve pull requests" has to be on,
      # or this step fails with a 403 that says so.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The action reads the tags to work out what has been released.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Open or update the version pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset:version
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag:
    name: tag
    needs: version
    # Nothing pending: the version PR was just merged, or there was nothing to release.
    if: needs.version.outputs.pending != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A tag pushed with GITHUB_TOKEN starts no workflow, so `release` below calls
      # release.yml directly instead of relying on its tag trigger.
      - name: Tag the version, once
        id: tag
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/api/package.json').version")"
          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Helpdock $version"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: release
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
