name: AI evaluation

# The evaluation of DOMAIN-RULES §9 (M7-11) against a real provider: the
# fixture knowledge base of `packages/ai/eval/` through ingest, retrieval and
# the auto-reply path, every answer judged by a model, the §9 thresholds
# checked per language, and the report attached to the run. It spends real
# provider calls, so it runs nightly and by hand — never on a pull request
# (`pnpm eval:ai` in mock mode is what CI runs there, as an integration
# suite). See docs/guides/ai.md#evaluation.
#
# Secrets: `AI_EVAL_API_KEY` (the chat and judge model's key) and, when the
# embeddings endpoint takes another one, `AI_EVAL_EMBEDDING_API_KEY`.
# Repository variables, each optional: `AI_EVAL_PROVIDER_KIND` (openai),
# `AI_EVAL_MODEL` (gpt-4o-mini), `AI_EVAL_JUDGE_MODEL` (the chat model),
# `AI_EVAL_BASE_URL`, `AI_EVAL_EMBEDDING_BASE_URL` (https://api.openai.com/v1),
# `AI_EVAL_EMBEDDING_MODEL` (text-embedding-3-small), `AI_EVAL_EMBEDDING_DIMS`
# (1536). Without the key the run stops with a notice instead of failing.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ai-eval-${{ github.ref }}
  cancel-in-progress: false

# Read-only: the run reads the repository, calls the provider and uploads an
# artifact. Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  evaluate:
    name: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # `secrets` is not a context `if:` can read, but `jobs.<id>.env` can, so
      # "is a key configured?" becomes an ordinary value (as `ci.yml` does for
      # Docker Hub) without putting the key in an expression.
      AI_EVAL_CONFIGURED: ${{ secrets.AI_EVAL_API_KEY != '' }}
      DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Is a provider configured?
        if: env.AI_EVAL_CONFIGURED != 'true'
        run: echo '::notice title=AI evaluation skipped::The AI_EVAL_API_KEY secret is not set, so there is no provider to evaluate against. See docs/guides/ai.md#evaluation.'

      - name: Checkout
        if: env.AI_EVAL_CONFIGURED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Testcontainers pulls pgvector and Redis from Docker Hub; authenticating
      # lifts the anonymous rate limit a shared runner address hits.
      - name: Log in to Docker Hub
        if: env.AI_EVAL_CONFIGURED == 'true' && env.DOCKERHUB_CONFIGURED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up pnpm
        if: env.AI_EVAL_CONFIGURED == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        if: env.AI_EVAL_CONFIGURED == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        if: env.AI_EVAL_CONFIGURED == 'true'
        run: pnpm install --frozen-lockfile

      # The api resolves some workspace packages through their `exports` maps.
      - name: Build workspace packages
        if: env.AI_EVAL_CONFIGURED == 'true'
        run: pnpm exec turbo run build --filter='./packages/*'

      - name: Evaluate against the provider
        if: env.AI_EVAL_CONFIGURED == 'true'
        run: pnpm eval:ai
        env:
          AI_EVAL_MODE: live
          AI_EVAL_PROVIDER_KIND: ${{ vars.AI_EVAL_PROVIDER_KIND || 'openai' }}
          AI_EVAL_API_KEY: ${{ secrets.AI_EVAL_API_KEY }}
          AI_EVAL_BASE_URL: ${{ vars.AI_EVAL_BASE_URL }}
          AI_EVAL_MODEL: ${{ vars.AI_EVAL_MODEL || 'gpt-4o-mini' }}
          AI_EVAL_JUDGE_MODEL: ${{ vars.AI_EVAL_JUDGE_MODEL }}
          AI_EVAL_EMBEDDING_BASE_URL: ${{ vars.AI_EVAL_EMBEDDING_BASE_URL || 'https://api.openai.com/v1' }}
          AI_EVAL_EMBEDDING_API_KEY: ${{ secrets.AI_EVAL_EMBEDDING_API_KEY || secrets.AI_EVAL_API_KEY }}
          AI_EVAL_EMBEDDING_MODEL: ${{ vars.AI_EVAL_EMBEDDING_MODEL || 'text-embedding-3-small' }}
          AI_EVAL_EMBEDDING_DIMS: ${{ vars.AI_EVAL_EMBEDDING_DIMS || '1536' }}
          AI_EVAL_REPORT_DIR: ${{ github.workspace }}/eval-report

      # Whether the thresholds were met or not: the report is the point.
      - name: Upload the report
        if: always() && env.AI_EVAL_CONFIGURED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-eval-report
          path: eval-report
          retention-days: 30
          if-no-files-found: warn
