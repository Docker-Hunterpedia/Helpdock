name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Named `ci` so it can be added as the required status check on the `main`
  # ruleset. Integration tests (Testcontainers), CodeQL and the image build join
  # this workflow with M0-11.
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Check app import boundaries
        run: pnpm check:boundaries

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test

      - name: Build
        run: pnpm build
