# Flattened external-proxy topology for Dokploy's self-contained template import.
# Domain routing is injected by Dokploy from template.toml; no host ports/Caddy.
x-helpdock: &helpdock
  image: ghcr.io/docker-hunterpedia/helpdock:1.4.0
  restart: unless-stopped
  stop_grace_period: 30s
  environment: &environment
    APP_URL: ${APP_URL:?set APP_URL}
    APP_ROLE: api
    NODE_ENV: production
    APP_MASTER_KEY: ${APP_MASTER_KEY:?set APP_MASTER_KEY}
    METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
    HD_SETUP_TOKEN: ${HD_SETUP_TOKEN:?set HD_SETUP_TOKEN}
    PORT: '3000'
    TRUST_PROXY: 'uniquelocal'
    DATABASE_URL: postgres://helpdock_app:${HELPDOCK_APP_PASSWORD:?set HELPDOCK_APP_PASSWORD}@postgres:5432/helpdock
    DATABASE_MIGRATION_URL: postgres://helpdock_owner:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/helpdock
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
    S3_REGION: ${S3_REGION:?set S3_REGION}
    S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *helpdock
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3000/ready").then(r=>process.exit(r.ok?0:1),()=>process.exit(1))']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
  worker:
    <<: *helpdock
    environment:
      <<: *environment
      APP_ROLE: worker
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: helpdock_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: helpdock
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U helpdock_owner -d helpdock']
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pg_data:
  redis_data:
