name: Pages

# Builds the product website in `site/` (Astro, static output) and publishes it
# to GitHub Pages, served at https://helpdock.oday-bakkour.com
# (`site/public/CNAME`). The site renders docs/guides and the changelogs, so a
# change to those redeploys it too. A pull request builds and tests the site
# without deploying it. The procedure and the one-time repository settings are
# in docs/guides/website.md.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/guides/**'
      - 'CHANGELOG.md'
      - 'apps/api/CHANGELOG.md'
      - 'apps/api/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/guides/**'
      - 'CHANGELOG.md'
      - 'apps/api/CHANGELOG.md'
      - 'apps/api/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# One deployment at a time; a newer push waits rather than cancelling a
# deployment that is already rolling out. Pull requests get their own group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changelog page dates each release from its tag.
          fetch-tags: true
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test the website's helpers
        run: pnpm --filter @helpdock/website test
      # The site shows the latest published, non-prerelease Release. Fail rather
      # than publish a wrong version if the lookup does not answer; the build
      # itself refuses a value that is not a plain x.y.z.
      - name: Look up the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Build the site
        env:
          HELPDOCK_VERSION: ${{ steps.release.outputs.version }}
        run: pnpm --filter @helpdock/website build
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
