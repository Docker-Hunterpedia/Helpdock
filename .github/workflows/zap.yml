name: ZAP baseline

# ARCHITECTURE §15: "a ZAP baseline scan against the docker-compose stack on
# release branches" (M9-05). A passive scan: ZAP spiders the running stack and
# reports what the responses say about it — headers, cookies, information
# leaks — without attacking anything. The external pentest (M9-01) is the
# active half.
#
# It builds the image from the commit, starts the same Compose stack the smoke
# test uses (`scripts/zap-stack.sh`), finishes the first-run wizard and scans
# http://127.0.0.1:3000. Any alert the rules file does not lower fails the run.
# `.zap/rules.tsv` is where an accepted finding goes, with its reason;
# `docs/guides/security-scanning.md` is the procedure.
on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: zap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_CONFIGURED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/docker-hunterpedia/helpdock:zap
          build-args: |
            HELPDOCK_VERSION=zap
            HELPDOCK_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the stack
        run: ./scripts/zap-stack.sh up
        env:
          HELPDOCK_VERSION: zap

      # The action runs ZAP's container on the host network, so 127.0.0.1 is
      # the stack. It opens no issue: the report is an artifact of the run.
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:3000
          rules_file_name: .zap/rules.tsv
          # -a: the alpha passive rules too. -j: the AJAX spider as well, for
          # the admin's client-side routes.
          cmd_options: -a -j
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline

      - name: Stop the stack
        if: always()
        run: ./scripts/zap-stack.sh down
