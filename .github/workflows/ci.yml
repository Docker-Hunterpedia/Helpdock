name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only. Nothing in this workflow publishes: the image is built and loaded
# into the local daemon for the smoke test, and `release.yml` is the only
# workflow that pushes anything anywhere.
permissions:
  contents: read

jobs:
  # Named `ci` so it can be added as the required status check on the `main`
  # ruleset. Every check a pull request has to pass is a step of this one job,
  # in the order a developer would run them: cheap and local first, containers
  # and browsers after.
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      # `secrets` is not a context `if:` can read, on a step or on a job
      # (GitHub's "context availability" table), but `jobs.<id>.env` can. This
      # turns "is a Docker Hub account configured?" into an ordinary env value
      # the login step below can be conditioned on, without ever putting the
      # token itself in an expression.
      DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      # `persist-credentials: false` because this job pushes nothing. By default
      # `checkout` leaves the run's token in `.git/config`, where every install
      # script, build plugin and test in the steps below could read it — and on
      # a pull request those steps are running the contributor's code.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Anonymous pulls from Docker Hub are rate limited per IP, and a
      # GitHub-hosted runner shares its address with everybody else's. This job
      # pulls `node` for the image build, `pgvector/pgvector:pg17` and
      # `redis:7-alpine` for both Testcontainers and the Compose smoke test, and
      # Testcontainers' own `ryuk` reaper — so a busy hour used to fail a run for
      # a reason unrelated to the code. Authenticating lifts the limit. It is
      # optional on purpose: a fork has no such secret, and the run must still
      # work without one — which is why M1-10's MinIO comes from Quay instead
      # (`docker-compose.yml`, `media.integration.test.ts`): a fork without the
      # secret would otherwise fail on the one image this job cannot do without.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_CONFIGURED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The media pipeline spawns ffmpeg and ffprobe for voice notes and video
      # posters (ARCHITECTURE §9), and `docker/Dockerfile` installs them into
      # the image. The integration suite that exercises them skips itself when
      # they are absent, so without this step the encoding assertions would
      # silently not run. `ffmpeg` on the runner image pulls `ffprobe` with it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Check app import boundaries
        run: pnpm check:boundaries

      # DOMAIN-RULES §1.3: "Missing decorator fails the request in development
      # and in CI." The permission guard is the runtime half; this is CI's.
      - name: Check route permission declarations
        run: pnpm check:routes

      # The same idea for input: every @Param, @Query and @Body names its
      # schema, so validation cannot be switched off by an `import type`
      # (issue #36).
      - name: Check route input validation
        run: pnpm check:validation

      - name: Typecheck
        run: pnpm typecheck

      # The `packages/*` gate of ARCHITECTURE §15 lives in the root
      # `vitest.config.ts` and fails this step at under 80 % of lines.
      - name: Test with coverage
        run: pnpm test

      # GitHub-hosted runners ship a Docker daemon, so Testcontainers starts the
      # containers itself. No service container is declared here on purpose.
      - name: Integration tests
        run: pnpm test:integration

      # The api is the one workspace whose behaviour is mostly reached over
      # HTTP, so its gate is measured across the unit and the integration
      # suites together (M0-05).
      - name: Api coverage gate
        run: pnpm --filter @helpdock/api test:coverage

      # The admin has a gate of its own from M0-08: the first-run wizard is the
      # one screen an operator cannot skip, and the root gate in
      # `vitest.config.ts` measures `packages/*` only.
      - name: Admin coverage gate
        run: pnpm --filter @helpdock/admin test:coverage

      - name: Build
        run: pnpm build

      # Keyed by the Playwright version the lockfile resolved, so an upgrade
      # downloads the matching browser instead of reusing the old one.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @helpdock/admin exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm --filter @helpdock/admin exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm --filter @helpdock/admin e2e

      # Pixels, not behaviour, and a comparison with no baseline on disk fails
      # rather than skips — so the step asks first. The baselines are Linux and
      # are produced by `screenshots.yml` on this same runner image with this
      # same browser install, which is what makes them comparable at all.
      - name: Are the screenshot baselines committed?
        id: baselines
        run: |
          if [ -d apps/admin/e2e/__screenshots__ ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Screenshot comparison
        if: steps.baselines.outputs.present == 'true'
        run: pnpm --filter @helpdock/admin e2e:screenshots

      # The same screens against a real api, a real Postgres and a real Redis:
      # the M0 exit criterion that every auth method works end to end.
      - name: Browser tests against the real api
        run: pnpm --filter @helpdock/admin e2e:api

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/admin/playwright-report
          retention-days: 7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Not pushed: the release workflow publishes the multi-arch image
      # (ARCHITECTURE §16). `load: true` puts it in the daemon so the smoke test
      # below runs the image this commit produced.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/docker-hunterpedia/helpdock:ci
          build-args: |
            HELPDOCK_VERSION=ci
            HELPDOCK_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The browser-less end-to-end test for M0-09: the stack comes up, the api
      # serves the admin build, and an unverified domain gets no certificate.
      - name: Compose smoke test
        run: ./scripts/compose-smoke.sh
        env:
          HELPDOCK_VERSION: ci
