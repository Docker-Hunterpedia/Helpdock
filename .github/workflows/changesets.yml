name: Changesets

# ARCHITECTURE §16: "Main: Changesets version PR → on merge: tag, GitHub release
# with changelog + SBOM …". This is the first half. It keeps a pull request open
# on `main` that consumes every `.changeset/*.md` accumulated since the last
# release, bumps `apps/api/package.json` — the version the System page reports
# and the image is tagged with — and writes its changelog.
#
# It publishes nothing: every workspace is private and nothing goes to npm. The
# release is the `v*` tag a maintainer pushes after merging that pull request,
# which `release.yml` turns into an image and a GitHub Release.
on:
  push:
    branches: [main]

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    permissions:
      # The `changeset-release/main` branch the action force-pushes.
      contents: write
      # The "Version Packages" pull request itself. The repository setting
      # "Allow GitHub Actions to create and approve pull requests" has to be on,
      # or this step fails with a 403 that says so.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The action reads the tags to work out what has been released.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Open or update the version pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset:version
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
