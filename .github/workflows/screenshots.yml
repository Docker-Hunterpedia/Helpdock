name: Screenshots

# The screenshot baselines in `apps/admin/e2e/__screenshots__/` are Linux
# pixels, because `ci.yml` compares them on `ubuntu-latest`. Nobody on macOS or
# Windows can produce those by hand, so this workflow produces them here and
# hands them back as an artifact to download and commit (issue #32).
#
# It runs on the same runner image, with the same
# `playwright install --with-deps chromium`, as the comparison step in `ci.yml`.
# That is the whole point: a baseline rendered by a different browser build or a
# different font set is not a baseline, it is a future false failure.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/admin/src/**'
      - 'apps/admin/e2e/screenshots.spec.ts'
      - 'packages/ui/src/**'

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

# Read-only, and `pull_request` rather than `pull_request_target`: a run for a
# pull request from a fork checks out that fork's code, so it must never hold a
# token that can write to this repository or read a secret. It needs neither.
permissions:
  contents: read

jobs:
  screenshots:
    name: screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The dev server resolves `@helpdock/ui` and `@helpdock/i18n` through
      # their `exports` maps, so the packages need a `dist/` before it starts.
      - name: Build
        run: pnpm build

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @helpdock/admin exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm --filter @helpdock/admin exec playwright install --with-deps chromium

      - name: Render the baselines
        run: pnpm --filter @helpdock/admin e2e:screenshots --update-snapshots

      # Unpacks straight over `apps/admin/e2e/__screenshots__/`, so committing
      # them is `gh run download` in the repository root and then `git add`.
      - name: Upload the baselines
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-baselines
          path: apps/admin/e2e/__screenshots__
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-playwright-report
          path: apps/admin/playwright-report
          retention-days: 7
