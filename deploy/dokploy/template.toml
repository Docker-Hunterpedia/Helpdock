[variables]
main_domain = "${domain}"
master_key = "${base64:32}"
setup_token = "${password:48}"
postgres_password = "${hash:32}"
app_password = "${hash:32}"

[[config.domains]]
serviceName = "api"
port = 3000
host = "${main_domain}"

[config.env]
APP_URL = "https://${main_domain}"
APP_MASTER_KEY = "${master_key}"
HD_SETUP_TOKEN = "${setup_token}"
POSTGRES_PASSWORD = "${postgres_password}"
HELPDOCK_APP_PASSWORD = "${app_password}"
TRUST_PROXY = "uniquelocal"
# Supply a private bucket and credentials before deploying.
S3_ENDPOINT = ""
S3_REGION = "auto"
S3_BUCKET = ""
S3_ACCESS_KEY_ID = ""
S3_SECRET_ACCESS_KEY = ""
S3_FORCE_PATH_STYLE = "false"
